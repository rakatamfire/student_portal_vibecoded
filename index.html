<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNU Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14183a;--navy:#1b2a6b;--navy2:#2a3d94;--gold:#f2b632;--bg:#f3f5fb;--card:#fff;--line:#e2e6f2;--muted:#5b6385;--ok:#1d7f55;--bad:#b3321f;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.55 "Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.mark,.big{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dbe2ff;padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}
.brand b{display:block;color:#fff;font-size:1.05rem}.brand small{color:#a9b5f0;font-size:.8rem}
.mark{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#c6d0ff;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.09)}
.nav a[aria-current=page]{background:#fff;color:var(--navy);font-weight:600}
.badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:.75rem;font-weight:600;border-radius:99px;padding:0 8px;min-width:22px;text-align:center}
.demo{margin-top:auto;font-size:.8rem;color:#a9b5f0;padding:0 8px}
main{padding:36px clamp(18px,4vw,48px) 48px;max-width:1120px;width:100%}
main:focus{outline:none}
.head{margin-bottom:24px}.head h1{font-size:clamp(1.8rem,3.2vw,2.4rem);font-weight:700}.head p{color:var(--muted);margin-top:6px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:1.15rem;margin-bottom:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px}
/* hero: today */
.today-card{background:var(--navy);color:#fff;border:0;border-radius:20px;padding:24px}
.today-card h2{color:#fff;font-size:1.4rem}.today-card .sub{color:#b9c5ff;margin:-8px 0 18px}
.tl{list-style:none;display:grid;gap:10px}
.slot{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);border-left:5px solid hsl(var(--h) 75% 65%)}
.slot time{font-weight:600;font-size:.95rem}.slot time small{display:block;font-weight:400;color:#b9c5ff}
.slot b{display:block;font-weight:600}.slot span{color:#b9c5ff;font-size:.9rem}
.slot em{font-style:normal;font-size:.8rem;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid #8d9ce6}
.slot.done{opacity:.5}
.slot.now{background:#fff;color:var(--ink)}.slot.now time small,.slot.now span{color:var(--muted)}
.slot.now em{background:var(--gold);border-color:var(--gold);color:var(--navy);display:flex;gap:6px;align-items:center}
.slot.now em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.empty{padding:16px;color:#b9c5ff}
/* lists */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i u{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 60% 48%)}
.bar b{text-align:right}
.plain{list-style:none;display:grid;gap:12px}
.due{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.due .d{text-align:center;border-radius:10px;background:var(--bg);padding:6px 0;font-size:.8rem;line-height:1.2}.due .d b{display:block;font-size:1.15rem;font-family:"Bricolage Grotesque",serif}
.due small,.muted{color:var(--muted)}.due b.t{display:block;font-weight:600}
.link{background:none;border:0;color:var(--navy2);font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
.mini{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.mini:last-child{border:0}.mini b{font-weight:600}.mini small{color:var(--muted)}
/* schedule */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start}
.day h2{font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.day h2 span{font-family:"Public Sans",sans-serif;font-size:.75rem;background:var(--gold);color:var(--navy);padding:1px 9px;border-radius:99px;font-weight:600}
.day.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.cls{border-radius:10px;padding:10px 12px;background:hsl(var(--h) 85% 95%);border-left:4px solid hsl(var(--h) 60% 48%);font-size:.9rem}
.cls b{display:block}.cls small{color:var(--muted);display:block}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sw{display:flex;gap:12px}.sw i{width:12px;border-radius:6px;background:hsl(var(--h) 60% 48%);flex:none}
/* grades */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:16px 0 20px}
.tile .big{font-size:2.2rem;font-weight:700;display:block}.tile span{color:var(--muted);font-size:.9rem}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input[type=search],.f input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}
.tablewrap{overflow-x:auto;padding:6px 8px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.85rem}tr:last-child td{border:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.note{color:var(--muted);font-size:.88rem;margin-top:12px}
/* announcements */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
details{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:center;padding:16px 18px}
summary::-webkit-details-marker{display:none}
summary b{display:block}summary small{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:transparent}
details.unread .dot{background:var(--gold);box-shadow:0 0 0 3px #fbe6b0}details.unread summary b{font-weight:700}
details p{padding:0 18px 18px 44px;max-width:70ch}
/* profile */
.pcard{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.av{width:72px;height:72px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:1.7rem;font-weight:700;font-family:"Bricolage Grotesque",serif;flex:none}
dl{display:grid;grid-template-columns:130px 1fr;gap:10px 14px}dt{color:var(--muted)}dd{font-weight:500}
.f{display:grid;gap:14px}.f label{display:grid;gap:4px;font-weight:500}.f input{width:100%}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}.btn:hover{background:var(--navy2)}
.row{display:flex;gap:12px;align-items:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
@media(max-width:760px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 8px;z-index:5;border-top:1px solid #3a4c9e}
 .brand,.demo{display:none}
 .nav{flex-direction:row;width:100%;justify-content:space-around}
 .nav a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px}.nav .badge{position:absolute;top:0;right:2px;margin:0;font-size:.65rem;min-width:18px;padding:0 5px}
 main{padding-bottom:96px}
 .slot{grid-template-columns:72px 1fr}.slot em{grid-column:2;justify-self:start}
 dl{grid-template-columns:1fr}dt{margin-top:6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark">H</span><div><b>HNU Portal</b><small>Student services</small></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <p class="demo">Sample data. Edit the data block at the top of the script in index.html to make it yours.</p>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ DATA: edit this block to personalize the portal ============ */
const student={name:'Juan Dela Cruz',id:'2023-00142',program:'BS Management Information Systems',year:'3rd Year',section:'MIS 3A',adviser:'Prof. A. Dizon',status:'Regular'};
const term='1st Semester, AY 2026–2027';
const courses=[
 {code:'IS 301',name:'Systems Analysis and Design',units:3,room:'Room 305',prof:'Prof. M. Reyes',hue:222,g:[91,88,null]},
 {code:'IS 302',name:'Database Management Systems',units:3,room:'Computer Lab 2',prof:'Prof. L. Santos',hue:160,g:[94,90,null]},
 {code:'IS 303',name:'Web Systems and Technologies',units:3,room:'Computer Lab 1',prof:'Prof. J. Villanueva',hue:28,g:[96,93,null]},
 {code:'IS 304',name:'IT Infrastructure and Networks',units:3,room:'Room 310',prof:'Prof. R. Cabrera',hue:280,g:[86,84,null]},
 {code:'MGT 305',name:'Business Process Management',units:3,room:'Room 212',prof:'Prof. A. Dizon',hue:340,g:[89,92,null]}
];
/* [course index, weekday (1=Mon), start, end] */
const slots=[[0,1,'08:00','09:30'],[2,1,'10:00','12:00'],[3,1,'13:00','14:30'],[1,2,'09:00','11:00'],[4,2,'13:00','14:30'],[0,3,'08:00','09:30'],[2,3,'10:00','12:00'],[3,3,'13:00','14:30'],[1,4,'09:00','11:00'],[4,4,'13:00','14:30'],[2,5,'09:00','11:00'],[3,5,'14:00','16:00']];
const prevTerm=[
 {code:'IS 201',name:'Programming Fundamentals II',units:3,g:[92,90,94]},
 {code:'IS 202',name:'Data Structures',units:3,g:[88,86,90]},
 {code:'IS 203',name:'Accounting for IT Professionals',units:3,g:[85,87,86]},
 {code:'GE 104',name:'Ethics',units:3,g:[95,93,96]},
 {code:'PE 4',name:'Fitness and Wellness',units:2,g:[97,98,98]}
];
/* offsets are days from today, so the sample data always looks current */
const due=[{t:'Entity-relationship diagram',c:1,off:2},{t:'Network topology lab report',c:3,off:4},{t:'Web app prototype demo',c:2,off:8},{t:'Process mapping case study',c:4,off:12}];
const news=[
 {id:1,cat:'Academic',off:-1,title:'Midterm grades are now posted',body:'Your midterm grades are available on the Grades page. If you spot a mistake, talk to your instructor within five school days.'},
 {id:2,cat:'Finance',off:-2,title:'Finals payment deadline',body:'Settle your remaining balance at the cashier by '+new Date(Date.now()+10*864e5).toLocaleDateString('en-PH',{month:'long',day:'numeric'})+' to receive your finals permit.'},
 {id:3,cat:'Events',off:-3,title:'MIS Tech Talk: careers in data and systems',body:'Alumni working in analytics and IT consulting share how they got started. Open to all MIS students, with a Q&A at the end.'},
 {id:4,cat:'Campus',off:-5,title:'Library hours extended for finals',body:'The library stays open two extra hours on weekdays during finals. Bring your school ID at the entrance.'},
 {id:5,cat:'Academic',off:-7,title:'Enrollment advising opens next month',body:'Meet your adviser to plan next semester’s subjects. Bring your latest grade report.'},
 {id:6,cat:'Events',off:-9,title:'Intramurals schedule released',body:'Team schedules for basketball, volleyball and esports are posted at the student affairs office.'}
];
/* ================================ APP ================================ */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('hnu:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('hnu:'+k,JSON.stringify(v))}catch(e){}}};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const day=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const fmt=(d,o)=>d.toLocaleDateString('en-PH',o||{month:'short',day:'numeric'});
const mins=t=>{const[a,b]=t.split(':');return a*60+ +b};
const t12=t=>{let[h,m]=t.split(':');h=+h;return (h%12||12)+':'+m+' '+(h>=12?'PM':'AM')};
const eq=p=>p>=97?1:p>=94?1.25:p>=91?1.5:p>=88?1.75:p>=85?2:p>=82?2.25:p>=79?2.5:p>=76?2.75:p>=75?3:5;
const head=(t,s)=>`<header class="head"><h1>${t}</h1><p>${s}</p></header>`;
const getRead=()=>store.get('read',[4,5,6]);
const unread=()=>news.filter(n=>!getRead().includes(n.id)).length;
function calc(rows){
 const r=rows.map(c=>{const g=c.g.filter(x=>x!=null),avg=g.reduce((a,b)=>a+b,0)/g.length;return{...c,avg,e:eq(Math.round(avg)),done:g.length===3}});
 const u=r.reduce((a,c)=>a+c.units,0);
 return{rows:r,units:u,gpa:r.reduce((a,c)=>a+c.e*c.units,0)/u,done:r.every(c=>c.done)};
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const prof=()=>store.get('profile',{nick:'',email:'',phone:'',address:''});
const initials=n=>n.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();

function dashboard(){
 const now=new Date(),d=now.getDay(),nm=now.getHours()*60+now.getMinutes(),h=now.getHours();
 const hi=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 const name=prof().nick||student.name.split(' ')[0];
 const today=slots.filter(s=>s[1]===d).sort((a,b)=>mins(a[2])-mins(b[2]));
 let nextSet=false;
 const tl=today.length?today.map(s=>{
  const c=courses[s[0]];let st='done';
  if(mins(s[3])>nm){if(mins(s[2])<=nm)st='now';else if(!nextSet){st='next';nextSet=true}else st='later'}
  return `<li class="slot ${st}" style="--h:${c.hue}"><time>${t12(s[2])}<small>${t12(s[3])}</small></time><div><b>${c.name}</b><span>${c.code}, ${c.room}</span></div>${st==='now'?'<em>In session</em>':st==='next'?'<em>Up next</em>':''}</li>`}).join('')
  :`<li class="empty">No classes today. Open the schedule to see what’s coming this week.</li>`;
 const g=calc(courses.map(c=>c)).rows;
 const left=n=>n===0?'today':n===1?'tomorrow':'in '+n+' days';
 return head(`${hi}, ${name}`,`${term}. ${student.program}, ${student.year}.`)+`
 <div class="cols"><div class="stack">
  <section class="card today-card"><h2>${DAYS[d]}, ${fmt(now,{month:'long',day:'numeric'})}</h2><p class="sub">${today.length} ${today.length===1?'class':'classes'} today</p><ul class="tl">${tl}</ul></section>
  <section class="card"><h2>Latest announcements</h2>${news.slice(0,3).map(n=>`<a class="mini" href="#announcements"><b>${n.title}</b><small>${n.cat}, ${fmt(day(n.off))}</small></a>`).join('')}</section>
 </div><div class="stack">
  <section class="card"><h2>Grades so far</h2><div class="bars">${g.map(c=>`<div class="bar" style="--h:${courses.find(x=>x.code===c.code).hue}"><span>${c.code}</span><i><u style="width:${c.avg}%"></u></i><b>${c.avg.toFixed(0)}</b></div>`).join('')}</div><p class="note">Average of prelim and midterm. <a class="link" href="#grades">See details</a></p></section>
  <section class="card"><h2>Upcoming deadlines</h2><ul class="plain">${due.map(x=>`<li class="due"><div class="d">${fmt(day(x.off),{month:'short'})}<b>${day(x.off).getDate()}</b></div><div><b class="t">${x.t}</b><small>${courses[x.c].code}, ${left(x.off)}</small></div></li>`).join('')}</ul></section>
 </div></div>`;
}

function schedule(){
 const td=new Date().getDay();
 const cols=[1,2,3,4,5].map(d=>{
  const it=slots.filter(s=>s[1]===d).sort((a,b)=>mins(a[2])-mins(b[2]));
  return `<section class="day ${d===td?'today':''}"><h2>${DAYS[d]}${d===td?'<span>Today</span>':''}</h2>${it.map(s=>{const c=courses[s[0]];return `<div class="cls" style="--h:${c.hue}"><b>${c.name}</b><small>${t12(s[2])} to ${t12(s[3])}</small><small>${c.room}</small></div>`}).join('')}</section>`}).join('');
 return head('Class schedule',`${term}. Times follow your device’s clock for the Today highlight.`)+`<div class="week">${cols}</div>
 <section class="card"><h2>Your subjects</h2><div class="subjects">${courses.map(c=>`<div class="sw" style="--h:${c.hue}"><i></i><div><b>${c.code}, ${c.name}</b><div class="muted">${c.prof}, ${c.units} units</div></div></div>`).join('')}</div></section>`;
}

let termKey='cur';
const terms={cur:{label:term,rows:courses},prev:{label:'2nd Semester, AY 2025–2026',rows:prevTerm}};
function grades(){
 const r=calc(terms[termKey].rows),best=[...r.rows].sort((a,b)=>b.avg-a.avg)[0];
 const cell=v=>v==null?'<span class="muted">Pending</span>':v;
 return head('Grades','Grades use the 1.00 to 5.00 scale, where 1.00 is the highest and 3.00 is the lowest passing grade.')+`
 <div class="toolbar"><label>Term <select id="term">${Object.entries(terms).map(([k,v])=>`<option value="${k}" ${k===termKey?'selected':''}>${v.label}</option>`).join('')}</select></label></div>
 <div class="tiles"><div class="card tile"><span class="big">${r.gpa.toFixed(2)}</span><span>${r.done?'Term GPA':'Running GPA'}</span></div><div class="card tile"><span class="big">${r.units}</span><span>Units</span></div><div class="card tile"><span class="big">${best.code}</span><span>Highest average (${best.avg.toFixed(1)})</span></div></div>
 <div class="card tablewrap"><table><thead><tr><th>Subject</th><th class="n">Units</th><th class="n">Prelim</th><th class="n">Midterm</th><th class="n">Finals</th><th class="n">Average</th><th class="n">Grade</th></tr></thead><tbody>
 ${r.rows.map(c=>`<tr><td><b>${c.code}</b><div class="muted">${c.name}</div></td><td class="n">${c.units}</td><td class="n">${cell(c.g[0])}</td><td class="n">${cell(c.g[1])}</td><td class="n">${cell(c.g[2])}</td><td class="n">${c.avg.toFixed(1)}</td><td class="n ${c.e<=3?'pass':'fail'}">${c.e.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
 <p class="note">${r.done?'This term is complete.':'Finals are pending, so grades shown are based on the exams recorded so far.'}</p>`;
}

let cat='All',q='';
function alist(){
 const rd=getRead();
 const it=news.filter(n=>(cat==='All'||n.cat===cat)&&(n.title+n.body).toLowerCase().includes(q.toLowerCase()));
 return it.length?it.map(n=>`<details data-id="${n.id}" class="${rd.includes(n.id)?'':'unread'}"><summary><span class="dot"></span><div><b>${n.title}</b><small>${n.cat}, ${fmt(day(n.off),{month:'long',day:'numeric'})}</small></div></summary><p>${n.body}</p></details>`).join('')
 :'<p class="muted">No announcements match. Clear the search or pick another category.</p>';
}
function announcements(){
 return head('Announcements','Open an item to read it. New ones are marked with a gold dot.')+`<div class="toolbar"><input id="q" type="search" placeholder="Search announcements" aria-label="Search announcements"><div class="chips">${['All','Academic','Finance','Events','Campus'].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div><button class="link" id="readall">Mark all as read</button></div><div id="alist">${alist()}</div>`;
}

function profile(){
 const p=prof(),nm=p.nick||student.name;
 return head('Student profile','Your academic details come from the registrar. Contact details are yours to edit and stay on this device.')+`
 <section class="card pcard"><div class="av">${initials(student.name)}</div><div><h2 style="margin:0">${student.name}</h2><p class="muted">${student.program}</p><p class="muted">ID ${student.id}</p></div></section>
 <div class="cols"><section class="card"><h2>Academic details</h2><dl><dt>Year level</dt><dd>${student.year}</dd><dt>Section</dt><dd>${student.section}</dd><dt>Adviser</dt><dd>${student.adviser}</dd><dt>Status</dt><dd>${student.status}</dd><dt>Units this term</dt><dd>${courses.reduce((a,c)=>a+c.units,0)}</dd></dl></section>
 <section class="card"><h2>Contact details</h2><form class="f" id="pf"><label>Preferred name<input name="nick" value="" autocomplete="nickname"></label><label>Email<input name="email" type="email" autocomplete="email"></label><label>Mobile number<input name="phone" type="tel" autocomplete="tel"></label><label>Address<input name="address" autocomplete="street-address"></label><div class="row"><button class="btn" type="submit">Save changes</button><button class="link" type="button" id="reset">Clear saved details</button></div></form></section></div>`;
}

const views={dashboard,schedule,grades,announcements,profile};
const titles={dashboard:'Dashboard',schedule:'Class schedule',grades:'Grades',announcements:'Announcements',profile:'Profile'};
const icons={
 dashboard:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
 schedule:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',
 grades:'<path d="M5 20V11M11 20V4M17 20v-6M2 20h20"/>',
 announcements:'<path d="M4 10v4l12 5V5zM19 9v6M7 15l1 5"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'
};
function nav(key){
 $('#nav').innerHTML=Object.keys(views).map(k=>`<a href="#${k}" ${k===key?'aria-current="page"':''}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]}</svg>${titles[k]}${k==='announcements'&&unread()?`<span class="badge" aria-label="${unread()} unread">${unread()}</span>`:''}</a>`).join('');
}
const bind={
 grades(){$('#term').onchange=e=>{termKey=e.target.value;route(true)}},
 announcements(){
  const qi=$('#q');qi.value=q;
  qi.oninput=()=>{q=qi.value;$('#alist').innerHTML=alist()};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;route(true)});
  $('#readall').onclick=()=>{store.set('read',news.map(n=>n.id));route(true);toast('All announcements marked as read')};
  $('#alist').onclick=e=>{const s=e.target.closest('summary');if(!s)return;const d=s.parentElement,id=+d.dataset.id,rd=getRead();if(!rd.includes(id)){rd.push(id);store.set('read',rd);d.classList.remove('unread');nav('announcements')}};
 },
 profile(){
  const f=$('#pf'),p=prof();
  ['nick','email','phone','address'].forEach(k=>f.elements[k].value=p[k]||'');
  f.onsubmit=e=>{e.preventDefault();store.set('profile',Object.fromEntries(new FormData(f)));toast('Changes saved')};
  $('#reset').onclick=()=>{store.set('profile',{nick:'',email:'',phone:'',address:''});f.reset();toast('Saved details cleared')};
 }
};
function route(keep){
 const h=location.hash.slice(1),key=views[h]?h:'dashboard';
 $('#view').innerHTML=views[key]();
 nav(key);document.title=titles[key]+' | HNU Student Portal';
 bind[key]&&bind[key]();
 if(!keep){window.scrollTo(0,0);$('#view').focus({preventScroll:true})}
}
window.addEventListener('hashchange',()=>route());
route(true);
</script>
</body>
</html>
